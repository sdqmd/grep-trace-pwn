rules:
  - id: express-taint-builtin-sinks
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: "user input ($SOURCE) reaches a dangerous function without sanitization"
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query.$X
              - pattern: $REQ.body.$X
              - pattern: $REQ.params.$X
    pattern-sanitizers:
      - pattern: parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch(...)
              - pattern: $RES.send(...)
              - pattern: $CP.exec(...)
              - pattern: $CP.execSync(...)
              - pattern: execSync(...)
              - pattern: $FS.readFileSync(...)
              - pattern: $DB.prepare(...)
              - pattern: eval(...)

  - id: express-taint-with-wrappers
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: "user input reaches a sink or a wrapper around one ($SINK)"
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query.$X
    pattern-sanitizers:
      - pattern: parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch(...)
              - pattern: $RES.send(...)
              - pattern: getUser(...)
              - pattern: getOrder(...)
              - pattern: runCmd(...)
              - pattern: readDoc(...)
